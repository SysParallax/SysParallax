services:
  web:
    build: .
    container_name: hackazon-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./src:/var/www/html

  db:
    image: mysql:5.7
    container_name: hackazon-db
    environment:
      MYSQL_DATABASE: hackazon
      MYSQL_USER: hackazon
      MYSQL_PASSWORD: hackazon
      MYSQL_ROOT_PASSWORD: hackazon-root
    command: --sql-mode="" --character-set-server=utf8 --collation-server=utf8_general_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - hackazon-db:/var/lib/mysql
      - ./src/database/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ./init/02-migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql:ro
      - ./init/03-demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
      - ./src/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./src/database/demo_database.sql:/docker-entrypoint-initdb.d/source/demo_database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhackazon", "-phackazon"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  hackazon-db:
